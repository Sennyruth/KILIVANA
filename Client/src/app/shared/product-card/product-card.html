<a class="product-card" [routerLink]="['/products', product()?.id]" (click)="false">
  <div class="product-card__image">
    @if (primaryImage) {
      <img [src]="primaryImage" [alt]="product()?.name ?? 'Product'" loading="lazy" />
    } @else {
      <div class="product-card__placeholder">
        <mat-icon>image</mat-icon>
      </div>
    }
    <span class="product-card__stock" [class]="stockClass">{{ stockLabel }}</span>
  </div>

  <div class="product-card__body">
    <div class="product-card__category">{{ product()?.category | titlecase }}</div>
    <h3 class="product-card__name">{{ product()?.name }}</h3>
    <div class="product-card__farmer">
      <mat-icon class="product-card__farmer-icon">person</mat-icon>
      <span>{{ product()?.farmerName }}</span>
      @if (product()?.farmerVerified) {
        <mat-icon class="product-card__verified">verified</mat-icon>
      }
    </div>

    <div class="product-card__footer">
      <div class="product-card__price">
        <span class="product-card__amount">{{ product()?.price | currency:'KES' }}</span>
        <span class="product-card__unit">/{{ product()?.unit }}</span>
      </div>
      <button mat-icon-button class="product-card__add" (click)="$event.preventDefault(); onAddToCart.emit()"
              [disabled]="!product()?.available" aria-label="Add to cart">
        <mat-icon>add</mat-icon>
      </button>
    </div>
  </div>
</a>
