<div class="auth-page">
  <div class="auth__card">
    <div class="auth__brand">
      <mat-icon class="auth__logo">eco</mat-icon>
      <span class="auth__title">Kilivana</span>
    </div>
    <h1 class="auth__heading">Verify your email</h1>
    <p class="auth__subtitle">
      We've sent a 6-digit code to <strong>{{ email() }}</strong>. Enter it below to verify your account.
    </p>

    <form class="auth__form" [formGroup]="form" (ngSubmit)="onSubmit()" autocomplete="off">
      <mat-form-field appearance="outline" class="auth__field auth__field--otp">
        <mat-label>Verification code</mat-label>
        <input
          matInput
          type="text"
          placeholder="123456"
          maxlength="6"
          formControlName="code"
          inputmode="numeric"
          pattern="\d*"
        />
        @if (form.get('code')?.touched && form.get('code')?.invalid) {
          <mat-error>Please enter a valid 6-digit code</mat-error>
        }
      </mat-form-field>

      @if (error()) {
        <p class="auth__error" role="alert">{{ error() }}</p>
      }

      <button mat-raised-button class="auth__submit" type="submit" color="primary" [disabled]="loading()">
        @if (loading()) {
          <mat-spinner diameter="20" />
        } @else {
          Verify Email
        }
      </button>
    </form>

    <div class="auth__footer">
      <button
        mat-button
        class="auth__link"
        (click)="onResend()"
        [disabled]="loading() || !canResend()"
      >
        @if (resendCountdown() > 0) {
          Resend code in {{ resendCountdown() }}s
        } @else {
          Resend code
        }
      </button>
      <button mat-button class="auth__link auth__link--muted" (click)="onBack()">Back to login</button>
    </div>
  </div>
</div>
